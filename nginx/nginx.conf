events {
  worker_connections 1024;
}

http {
  upstream fastapi_backend {
    server fastapi:8000;
  }

  upstream frontend_app {
    server frontend:3000;
  }

  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=upload:10m rate=10r/s;

  server {
    listen 80;
    server_name localhost;
    client_max_body_size 100m;

    # Document upload endpoint — relaxed rate limit + long timeouts
    location /api/documents/ {
      limit_req zone=upload burst=20 nodelay;
      proxy_pass http://fastapi_backend/documents/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 60s;
      proxy_send_timeout 300s;
      proxy_read_timeout 300s;
    }

    # Chat streaming endpoint — SSE, long timeouts, no buffering
    location /api/chat/ {
      proxy_pass http://fastapi_backend/chat/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      chunked_transfer_encoding on;
      proxy_connect_timeout 60s;
      proxy_send_timeout 600s;
      proxy_read_timeout 600s;
    }

    location /api/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://fastapi_backend/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 120s;
    }

    location /ws/ {
      proxy_pass http://fastapi_backend/ws/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 86400;
    }

    location / {
      proxy_pass http://frontend_app;
      proxy_set_header Host $host;
    }
  }
}
